[package]
name = "thruput-scp-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["cryptography::cryptocurrencies", "algorithms"]
description = "Stellar Consensus Protocol (SCP) kernel: nomination, ballot protocol and quorum sets"

# docs.rs builds the default features only; document the whole API.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The kernel's test harness (TestKernel, UnitTestKernel and the envelope
# builders in testutil) for downstream tests. Not part of the protocol
# implementation; off by default.
test-support = ["dep:rand"]

# Published as thruput-scp-kernel. The library keeps its name, so
# `use scp_kernel::...` is unchanged.
[lib]
name = "scp_kernel"
path = "src/lib.rs"

[dependencies]
thruput-scp = { workspace = true }
thruput-xdr = { workspace = true }
scp_util = { workspace = true }
serde_json = "1.0"
tracing = "0.1"
sha2 = "0.10"
thiserror = "2.0"
rand = { version = "0.9.3", optional = true }
xdr-common = { workspace = true }

[dev-dependencies]
rand = "0.9.3"
shfix = { workspace = true }
tracing-subscriber = "0.3"
