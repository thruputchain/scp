[package]
name = "thruput-scp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["cryptography::cryptocurrencies", "network-programming"]
description = "scpd, a standalone Stellar Consensus Protocol (SCP) daemon serving the SCP kernel over ONC-RPC"

[features]
info_callbacks = []
# Linux jemalloc allocator plus opt-in heap profiles. Off until load numbers
# qualify it.
heap-profiling = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-sys",
    "dep:backtrace",
    "dep:object",
]

[[bin]]
name = "scpd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
futures = "0.3"
thruput-scp = { workspace = true }
thruput-xdr = { workspace = true }
scp_util = { workspace = true }
scp_kernel = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47.1", features = ["full"] }
console-subscriber = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.34"
# internal-logs is off so the SDK does not log every failed export batch;
# telemetry.rs reports collector failures once.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }

xdr-common = { workspace = true }
thruput-rpc-driver = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"], optional = true }
tikv-jemalloc-sys = { version = "0.7", features = ["profiling"], optional = true }
backtrace = { version = "0.3", optional = true }
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"], optional = true }
