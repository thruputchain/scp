name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run hog schedule
      run: |
          # For pull requests, use the PR branch name (github.head_ref)
          # For push/workflow_dispatch, use the branch from github.ref_name
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"
          hog_sched \
            --i="${{ github.event.repository.name }}-${{ github.run_id }}" \
            --key=github_repo --value=${{ github.repository }} \
            --key=git_commit --value=${{ github.sha }} \
            --key=git_branch --value=$BRANCH_NAME \
            ./github/schedules/rs_build.toml


