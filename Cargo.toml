[workspace]
resolver = "3"
members = ["shfix", "scp_proto", "scp_util", "scp_kernel", "scp_server"]

[workspace.dependencies]
xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git", features = [
    "extras",
    "int128_xdr",
    "xdr_common",
    "derive",
    "ns",
] }
xdr_common = { git = "ssh://git@github.com/groundhogchain/xdr_common.git" }
rpc_driver = { git = "ssh://git@github.com/groundhogchain/xdr_rpc.git" }
