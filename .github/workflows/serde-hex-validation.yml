name: Validate serde hex migration
on:
  push:
    branches: [codex/retire-serde-arrays]
permissions:
  contents: read
jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
      - name: Resolve updated workspace dependencies
        run: cargo update --workspace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          retention-days: 1
      - name: Test generated hex serialization
        run: cargo test --locked --workspace
