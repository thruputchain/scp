[package]
name = "scp_proto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std", "xdrs"]
alloc = ["xdrs", "xdrs/alloc"]
std = ["alloc"]
xdrs = []

[dependencies]
async-trait = "0.1.89"

[dependencies.xdrs]
workspace = true
features = ["derive", "xdr_common", "extras", "int128_xdr", "ns", "alloc"]

[dependencies.xdr_common]
workspace = true

[dependencies.rpc_driver]
workspace = true
