[registries]
groundhog = { index = "sparse+https://crates.thruput.network/api/v1/crates/" }

[source]
groundhog = { registry = "sparse+https://crates.thruput.network/api/v1/crates/" }

# Stable Cargo scopes rustflags by target, not profile; these also apply to dev.
# An environment RUSTFLAGS (or CARGO_ENCODED_RUSTFLAGS) overrides these flags.
[build]
rustflags = ["-C", "force-frame-pointers=yes"]

# Target rustflags take precedence over build.rustflags, so repeat frame pointers.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "force-frame-pointers=yes", "-C", "link-arg=-Wl,--build-id=sha1"]
