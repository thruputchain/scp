name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-policy:
    permissions:
      contents: read
    # (No registry credentials here: every dependency comes from crates.io.)
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@484be875e4e630d26594110bcc0ab6bf42eeaba7

  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@484be875e4e630d26594110bcc0ab6bf42eeaba7

  build:
    needs: dependency-policy # inspect dependencies before anything builds them
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The same toolchain publish.yml releases with (the workspace's
      # rust-version), so CI exercises what crates.io users get.
      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.96.0

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # heap-profiling is off by default; keep the gated Linux code compiled
      # and tested, in both profiles.
      - name: Test heap profiling
        run: |
          cargo test --locked -p thruput-scp-server --features heap-profiling
          cargo test --locked -p thruput-scp-server --features heap-profiling --release

      # .cargo/config.toml asks for frame pointers and a GNU build ID in every
      # build; profilers rely on both. Check the flags on scpd's own rustc
      # invocation (touching main.rs forces it to recompile, so `-v` prints the
      # invocation rather than "Fresh"), then the build ID note in the binary.
      - name: Check release build flags
        run: |
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          touch scp_server/src/main.rs
          cargo build --release --locked -p thruput-scp-server --bin scpd -v 2>&1 | tee release-build.log
          grep -E '^ *Running `.*--crate-name scpd ' release-build.log > scpd-rustc.log
          grep -F -- '-C force-frame-pointers=yes' scpd-rustc.log
          grep -F -- '-C link-arg=-Wl,--build-id=sha1' scpd-rustc.log
          readelf -n target/release/scpd | grep -Eq 'Build ID: [[:xdigit:]]+'
