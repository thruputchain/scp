[package]
name = "scp_kernel"
version = "0.1.0"
edition = "2024"

[lib]
name = "scp_kernel"
path = "src/lib.rs"

[dependencies]
proto = { path = "../proto" }
shfix = { path = "../shfix" }
async-trait = "0.1"
derive_more = { version = "2", features = ["full"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
sha2 = "0.10"

[dependencies.xdr_common]
git = "ssh://git@github.com/groundhogchain/xdr_common.git"

[dependencies.thiserror]
version = "2.0"

[dependencies.rand]
version = "0.8"

[dev-dependencies]
tracing-subscriber = "0.3"
