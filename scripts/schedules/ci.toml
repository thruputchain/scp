name = "rs_build"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -ex

echo 'cloning repository'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout -q {{ .git_commit }}

# setup_cargo.sh replaces .cargo with the shared Cargo installation. Keep the
# repository config outside that directory and explicitly load it for release
# checks, without writing project flags into the shared installation's config.
release_config="$PWD/ci-release-cargo-config.toml"
cp .cargo/config.toml "$release_config"

source ./scripts/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

cargo fetch
cargo fmt --check
cargo build --offline --locked
cargo test --offline --locked

# heap-profiling is off by default; keep the gated Linux code compiled and tested.
cargo clippy --offline --locked -p thruput-scp-server --no-deps -- -D warnings
cargo clippy --offline --locked -p thruput-scp-server --no-deps --features heap-profiling -- -D warnings
cargo test --offline --locked -p thruput-scp-server --features heap-profiling
cargo test --offline --locked -p thruput-scp-server --features heap-profiling --release

# A fresh target directory guarantees verbose output includes the scpd rustc
# invocation even when the shared installation has cached release artifacts.
# No `|| exit 1` after the subshell: that would put it in a context where bash
# ignores errexit, so a failed check inside would not stop the subshell. The
# outer `set -e` fails the job when the subshell exits non-zero.
(
    set -euo pipefail
    unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
    mkdir -p "$PWD/target"
    CARGO_TARGET_DIR=$(mktemp -d "$PWD/target/ci-release.XXXXXX")
    export CARGO_TARGET_DIR
    cargo --config "$release_config" build --release --offline --locked -p thruput-scp-server --bin scpd -v 2>&1 | tee release-build.log
    # Check flags on the binary's actual compiler invocation, not a dependency.
    # Debian's linker adds a build ID by default, so readelf alone cannot show
    # that the repository's link argument was applied.
    grep -E '^ *Running `.*--crate-name scpd ' release-build.log > scpd-rustc.log
    grep -F -- '-C force-frame-pointers=yes' scpd-rustc.log
    grep -F -- '-C link-arg=-Wl,--build-id=sha1' scpd-rustc.log
    readelf -n "$CARGO_TARGET_DIR/release/scpd" > release-notes.log
    grep -Eq 'Build ID: [[:xdigit:]]+' release-notes.log
)

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"

[jobs.host]
rs_1 = "?"
