[package]
name = "scp_server"
version = "1.0.0"
edition = "2024"

[features]
info_callbacks = []

[[bin]]
name = "scpd"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5.47", features = ["derive"] }
derivative = "2.2"
futures = "0.3"
scp_proto = { path = "../scp_proto" }
scp_util = { path = "../scp_util" }
scp_kernel = { path = "../scp_kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47.1", features = ["full"] }
console-subscriber = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

xdr-common = { workspace = true }
rpc_driver = { workspace = true }
