[package]
name = "proto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = ["xdrs"]
xdrs = []

[dependencies.xdr_common]
git = "ssh://git@github.com/groundhogchain/xdr_common.git"

[dependencies.xdrs]
git = "ssh://git@github.com/groundhogchain/xdrs.git"
features = ["alloc", "derive", "cxs", "txs", "strict"]

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.ed25519-dalek]
version = "3.0.0-pre.0"
