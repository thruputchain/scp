name: Release dry run checks

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://crates.thruput.network/api/v1/crates/

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Loaded after checkout for the private source dependencies.
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.SCP_TO_SELF_KEY }}
            ${{ secrets.SCP_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.SCP_TO_PROTOCOL_KEY }}
            ${{ secrets.SCP_TO_XDR_COMMON_KEY }}
            ${{ secrets.SCP_TO_XDRS_KEY }}
            ${{ secrets.SCP_TO_XDR_RPC_KEY }}
            ${{ secrets.SCP_TO_SERDE_ARRAYS_KEY }}

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: publish dry run
        uses: thruputchain/actions/cargo-publish-dry-run@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          skip-clippy: false
          cargo-hack-feature-options: '--feature-powerset'
