[package]
name = "scp_proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SCP protocol types and definitions"

[lib]
crate-type = ["rlib"]

[features]
std = []
spec = []

[dependencies]
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_arrays = { package = "groundhog-serde_arrays", version = "0.2.0", registry = "groundhog", default-features = false, features = ["alloc"] }
serde_with = { version = "3.16.1", features = [] }
async-trait = "0.1.89"

xdrs = { workspace = true, features = ["serde"] }
xdr-common = { workspace = true }
rpc_driver = { workspace = true }
