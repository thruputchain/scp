[package]
name = "scp"
version = "0.1.0"
edition = "2024"

[lib]
name = "scp"
path = "src/lib.rs"

[[bin]]
name = "scp"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
async-trait = "0.1"
derive_more = { version = "2", features = ["full"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"

[dependencies.xdr_common]
git = "ssh://git@github.com/groundhogchain/xdr_common.git"

[dependencies.thiserror]
version = "2.0"

[dev-dependencies]
sha2 = "0.10"
