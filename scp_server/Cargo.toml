[package]
name = "scp_server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SCP consensus server"

[features]
info_callbacks = []

[[bin]]
name = "scpd"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5.47", features = ["derive"] }
futures = "0.3"
scp_proto = { workspace = true }
scp_util = { workspace = true }
scp_kernel = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47.1", features = ["full"] }
console-subscriber = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"

xdr-common = { workspace = true }
rpc_driver = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.7", features = ["profiling", "stats"] }
jemalloc_pprof = { version = "0.9", features = ["symbolize"] }
