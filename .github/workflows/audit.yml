name: Audit

on:
  schedule:
    - cron: '15 8 * * *' # daily at 08:15 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@6693fac8133585728ad3a4ca14e3441073b6def8 # v1
    with:
      checks: advisories
      registry-name: groundhog
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  notify:
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write # files the advisory issue
    uses: thruputchain/actions/.github/workflows/rust-advisory-issue.yml@6693fac8133585728ad3a4ca14e3441073b6def8 # v1
