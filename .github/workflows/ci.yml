name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-policy:
    permissions:
      contents: read
    # (No registry credentials here: every dependency comes from crates.io.)
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@484be875e4e630d26594110bcc0ab6bf42eeaba7

  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@484be875e4e630d26594110bcc0ab6bf42eeaba7
    with:
      shellcheck-scripts: true

  build:
    needs: dependency-policy # inspect dependencies before anything builds them
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Loaded last: no earlier step needs the key. hog_sched clones this
      # repository with it; every dependency comes from crates.io.
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.SCP_TO_SELF_KEY }}

      - name: Run hog schedule
        # Interpolations expand into the script *before* the shell sees it, so a
        # branch name carrying shell syntax would execute here. Pass via env.
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}  # PR branch, else pushed branch
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "Branch name: $BRANCH_NAME"
          hog_sched \
            --i="${REPO_NAME}-${RUN_ID}" \
            --key=github_repo --value="$REPOSITORY" \
            --key=git_commit --value="$SHA" \
            --key=git_branch --value="$BRANCH_NAME" \
            ./scripts/schedules/ci.toml
