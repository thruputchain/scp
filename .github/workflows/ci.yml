name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-policy:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@6693fac8133585728ad3a4ca14e3441073b6def8 # v0
    with:
      registry-name: groundhog
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@f40cda4f022ce0d9a6af3c7ec80baaab0bd6372f
    with:
      lint-app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
      shellcheck-scripts: true
    secrets:
      lint-app-private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}

  build:
    needs: dependency-policy # inspect dependencies before anything builds them
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      # hog ci overwrites the .cargo directory
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://crates.thruput.network/api/v1/crates/
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Loaded last: no earlier step needs the keys.
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.SCP_TO_SELF_KEY }}
            ${{ secrets.SCP_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.SCP_TO_PROTOCOL_KEY }}
            ${{ secrets.SCP_TO_XDR_COMMON_KEY }}
            ${{ secrets.SCP_TO_XDRS_KEY }}
            ${{ secrets.SCP_TO_XDR_RPC_KEY }}
            ${{ secrets.SCP_TO_SERDE_ARRAYS_KEY }}

      - name: Run hog schedule
        # Interpolations expand into the script *before* the shell sees it, so a
        # branch name carrying shell syntax would execute here. Pass via env.
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}  # PR branch, else pushed branch
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "Branch name: $BRANCH_NAME"
          hog_sched \
            --i="${REPO_NAME}-${RUN_ID}" \
            --key=github_repo --value="$REPOSITORY" \
            --key=git_commit --value="$SHA" \
            --key=git_branch --value="$BRANCH_NAME" \
            --key=cargo_registry_global_credential_providers --value="$CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS" \
            --key=cargo_registry_token --value="$CARGO_REGISTRIES_GROUNDHOG_TOKEN" \
            --key=cargo_registry_index --value="$CARGO_REGISTRIES_GROUNDHOG_INDEX" \
            --key=cargo_registry_source --value="$CARGO_REGISTRIES_GROUNDHOG_SOURCE" \
            ./scripts/schedules/ci.toml
