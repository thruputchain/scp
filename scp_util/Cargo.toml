[package]
name = "scp_util"
description = "SCP protocol manipulation utilities"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = ["xdrs"]
xdrs = []

[dependencies]
scp_proto = { path = "../scp_proto" }
ed25519-dalek = "3.0.0-pre.0"
thiserror = "2.0"
sha2 = "0.10"
base64 = "0.22"

xdr-common = { workspace = true }
xdrs = { workspace = true }

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]
