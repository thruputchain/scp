[package]
name = "thruput-scp-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hashing, Ed25519 signing and XDR helpers for the Stellar Consensus Protocol (SCP)"

# docs.rs builds the default features only; document the whole API.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Published as thruput-scp-util. The library keeps its name, so
# `use scp_util::...` is unchanged.
[lib]
name = "scp_util"
crate-type = ["rlib"]

[dependencies]
thruput-scp = { workspace = true }
thruput-xdr = { workspace = true }
ed25519-dalek = { version = "3.0.0-pre.0", features = ["digest"] }
thiserror = "2.0"
sha2 = "0.10"
base64 = "0.22"

xdr-common = { workspace = true }
xdrs = { workspace = true }
