[package]
name = "scp_proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SCP protocol types and definitions"

[lib]
crate-type = ["rlib"]

[features]
std = []

[dependencies]
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_with = { version = "3.16.1", features = [] }
async-trait = "0.1.89"

xdrs = { workspace = true, features = ["serde"] }
# The Serde adapter operates on plain byte arrays, independently of the
# older XDR/RPC types used by this workspace.
xdr-common = { version = "0.10.2", registry = "groundhog", features = ["serde"] }
rpc_driver = { workspace = true }

[dev-dependencies.serde_json]
version = "1.0"
